<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Almacén Cecilia</title>
    <link rel="stylesheet" href="estilo.css">
    
    <script>
        function cargarProductos() {
            var nombres = ["Criollitas", "Fruna", "CocaCola"];
            var precios = [1300, 800, 1500];

            document.getElementById("nombre1").innerHTML = nombres[0];
            document.getElementById("precio1").innerHTML = "Precio: $" + precios[0];

            document.getElementById("nombre2").innerHTML = nombres[1];
            document.getElementById("precio2").innerHTML = "Precio: $" + precios[1];

            document.getElementById("nombre3").innerHTML = nombres[2];
            document.getElementById("precio3").innerHTML = "Precio: $" + precios[2];
        }

        function Procesar() {
            console.log("funcion procesar");
            mensaje_correo();
            mensaje_texto();
        }

        function validar_correo(correo) {
            if (correo.length > 0) {
                return true;
            } else {
                return false;
            }
        }

        function validar_mensaje(texto) {
            if (texto.length > 0) {
                return true;
            } else {
                return false;
            }
        }

        function mensaje_correo() {
            var correoIngresado = document.getElementById("fcorreo").value;
            var mensaje = document.getElementById("mensaje_correo");

            if (correoIngresado === "") {
                mensaje.textContent = "El correo no puede estar vacío";
                mensaje.style.color = "red";
            } else if (validar_correo(correoIngresado)) {
                mensaje.textContent = " Correcto";
                mensaje.style.color = "green";
            } else {
                mensaje.textContent = " Error";
                mensaje.style.color = "red";
            }
        }

        function mensaje_texto() {
            var textoIngresado = document.getElementById("fmensaje").value;
            var mensaje = document.getElementById("mensaje_texto");

            if (validar_mensaje(textoIngresado)) {
                mensaje.textContent = " Correcto";
                mensaje.style.color = "green";
            } else {
                mensaje.textContent = " El mensaje no puede estar vacío";
                mensaje.style.color = "red";
            }
        }

        let tema_musical = {
        //tengo varias "propiedades"
        nombre :"NAVIDAD",
        artista: "COCACOLA",
        minutos : 3,
        segundos : 18,
        //propiedades nuevas
        archivo:"Coca Cola Despierta la magia Navidad 2010 (Version completa español) - Anna R. Urbina.mp3",
        playing : false,


        //quiero definir un metodo...
        play : function(){
            console.log("--funcion play --")
            //se usa this igual que en java  y en python se usa self
            if(!this.playing){
                console.log("--tocando el tema--");
                //voy  a crear otra propuedad  dentro del objeto,
                //desde dentro dle metodo.
                if(!this.audio){
                this.audio=new Audio(this.archivo)
                }
                this.audio.play();
                console.log(this.nombre + " - " + this.artista);
                console.log("duracion ->" + this.minutos + this.segundos);
                this.playing = true;
            }
        },
        //otro metodo mas
        pause : function(){
            console.log("--funciona pause--");
            if(this.playing){
                this.playing= false;
                this.audio.pause();

            }
        },


    };
    //aqui fuera del objeto
    //pero puedo  acceder  a las propiedades
    console.log(tema_musical.nombre);

    //inlcuso puedo modiicar las propiedades
    tema_musical.nombre= "Navidad";
    //verificar si el cambio se haya realizado
    console.log(tema_musical.nombre);
    </script>
</head>

<body onload="cargarProductos()">

    <div id="inicio">
        <h1>Almacén Cecilia</h1>
        <div id="navegacion">
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#productos">Ver Productos</a></li>
                <li><a href="#formulario">Contacto</a></li>
            </ul>
        </div>
    </div>

    <div id="contenido_principal">
        
        <div id="musica">
            <h2>Música Ambiental</h2>
            <form>
                <fieldset>
                    <button type="button" onclick="tema_musical.play()">Play!</button>
                    <button type="button" onclick="tema_musical.pause()">Pause</button>
                </fieldset>
            </form>
        </div>

        <br>

        <div id="productos">
            <h2>Nuestros Productos</h2>
            <div id="caja_productos">
                <div class="tarjeta_producto">
                    <img src="Imagen/Criollitas.jpg" alt="Galletas Criollitas">
                    <h3 id="nombre1"></h3>
                    <p id="precio1"></p>
                    <button type="button" onclick="anadirAlCarrito()">Añadir</button>
                </div>
                
                <div class="tarjeta_producto">
                    <img src="Imagen/fruna.png" alt="Helados Fruna">
                    <h3 id="nombre2"></h3>
                    <p id="precio2"></p>
                    <button type="button" onclick="anadirAlCarrito()">Añadir</button>
                </div>
                
                <div class="tarjeta_producto">
                    <img src="Imagen/Coca.jpg" alt="Bebida Coca Cola">
                    <h3 id="nombre3"></h3>
                    <p id="precio3"></p>
                    <button type="button" onclick="anadirAlCarrito()">Añadir</button>
                </div>
            </div>
        </div>

        <br><hr><br>

        <div id="formulario">
            <h2>Formulario de Contacto</h2>
            <div id="contenedor_formulario">
                <form id="formulario_contacto">
                    <fieldset>
                        <label for="fcorreo">Correo:</label>
                        <input type="text" id="fcorreo" name="fcorreo" oninput="mensaje_correo()"><span id="mensaje_correo"></span><br><br>
                        
                        <label for="fmensaje">Mensaje:</label><br>
                        <textarea id="fmensaje" name="fmensaje" rows="4" cols="30" oninput="mensaje_texto()"></textarea>
                        <span id="mensaje_texto"></span><br><br>
                        
                        <button type="reset">Limpiar</button>
                        <button type="button" onclick="Procesar()">Enviar</button>
                    </fieldset>
                </form>
            </div>
        </div>

    </div>

    

    <div id="pie_pagina">
        <hr>
        <div id="enlaces">
            <h3>Enlaces útiles</h3>
            <ul>
                <li> <a href="https://www.duoc.cl/" target="_blank"> Duoc </a> </li>
                <li> <a href="https://www.google.com/" target="_blank"> Google </a> </li>
                <li> <a href="https://www.sii.cl/" target="_blank"> SII </a> </li>
            </ul>
        </div>
        <div>
            <h3>Contacto Directo</h3>
            <p>Teléfono: <a href="tel:999999999">999999999</a></p>
            <p>Correo: <a href="mail:">cecilia@almacen.cl</a></p>
            <p>&copy; Almacén Cecilia.</p>
        </div>
    </div>

</body>
</html>
