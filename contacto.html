<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contacto - Almacén Cecilia</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header class="cabecera">
        <div class="logo"><h1>Almacén Cecilia</h1></div>
        <nav class="navegacion">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contenido-principal">
        <div class="contenedor-formulario">
            <h2>Formulario de Contacto</h2>
            <form id="formularioContacto" onsubmit="return enviarFormulario(event)">
                <div class="campo">
                    <label>Nombre (Max 100):</label>
                    <input type="text" id="nombre" maxlength="100">
                </div>
                <div class="campo">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="correo" maxlength="100" placeholder="@gmail.com o @duoc.cl">
                </div>
                <div class="campo">
                    <label>Mensaje (Max 500):</label>
                    <textarea id="mensaje" rows="4" maxlength="500"></textarea>
                </div>
                <div class="botones">
                    <button type="submit" class="boton-enviar">Enviar Mensaje</button>
                    <button type="reset" class="boton-limpiar">Limpiar</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function enviarFormulario(event) {
            event.preventDefault();
            var nombre = document.getElementById("nombre").value.trim();
            var correo = document.getElementById("correo").value.trim().toLowerCase();
            var mensaje = document.getElementById("mensaje").value.trim();

            var correoValido = correo.endsWith("@duoc.cl") || correo.endsWith("@profesor.duoc.cl") || correo.endsWith("@gmail.com");

            if (nombre === "") { alert("Ingresa tu nombre."); return; }
            if (!correoValido) { alert("Solo correos @duoc.cl, @profesor.duoc.cl o @gmail.com"); return; }
            if (mensaje === "") { alert("Escribe un mensaje."); return; }

            alert("¡Gracias " + nombre + "! Mensaje enviado.");
            document.getElementById("formularioContacto").reset();
        }
    </script>
</body>
</html>
